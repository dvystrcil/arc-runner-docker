name: Build and Push Runner Images

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC nightly
  workflow_dispatch:

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: arc

jobs:
  build:
    runs-on: arc-runner-docker-runner
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.7
      with:
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        env-slug: prod
        project-slug: homelab-bz-gt
        secret-path: /
        export-type: env
        domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

    - name: Fetch latest Harbor CA cert
      run: |
        kubectl get secret harbor-internal-ca -n harbor \
          -o jsonpath='{.data.ca\.crt}' | base64 -d > harbor-internal-ca.crt
        echo "CA cert fingerprint:"
        openssl x509 -noout -fingerprint -sha256 -in harbor-internal-ca.crt

    - name: Log in to Harbor (internal)
      uses: docker/login-action@v3
      with:
        registry: ${{ env.INTERNAL_REGISTRY }}
        username: ${{ env.HB_USERNAME }}
        password: ${{ env.HB_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-config-inline: |
          [registry."harbor-core.harbor.svc.cluster.local"]
            ca=["/etc/ssl/certs/ca-certificates.crt"]

    - name: Build and push actions-runner
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/actions-runner:latest
          ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/actions-runner:${{ github.run_number }}

    - name: Build and push dind
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.dind
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/dind:latest
          ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/dind:${{ github.run_number }}
