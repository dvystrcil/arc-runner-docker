name: Build and Push Runner Images

# Three ways in (homelab#1812 AC3). It was workflow_dispatch only, fired by
# mirror-base-images.yaml when an upstream digest moved, so a MERGED change
# here (kubectl v1.37.2, #29) sat unbuilt until upstream happened to move.
#   push:     a merged change to anything that goes into an image
#   schedule: weekly, for apt-get upgrade in the Dockerfile; also the backstop
#             if a build is missed (GitHub's 30-day runner-update rule)
#   dispatch: the upstream watcher, and by hand
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dind'
      - 'Dockerfile.orcaslicer'
      - 'harbor-internal-ca.crt'
      - 'scripts/**'
      - '.github/workflows/build.yaml'
  schedule:
    - cron: '17 4 * * 0'   # Sundays 04:17 UTC
  workflow_dispatch:
    inputs:
      # Set by mirror-base-images.yaml: which upstream digest moved, old -> new.
      # Empty means a person dispatched it. Goes into the release body (#58).
      reason:
        description: Why this build is running (the upstream watcher fills this in)
        required: false
        default: ''

# A push and the watcher can fire together; both push :latest, so never run
# two at once (a later-starting, earlier-finishing build would be overwritten).
concurrency:
  group: build-runner-images
  cancel-in-progress: false

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: arc

jobs:
  build:
    runs-on: arc-runner-docker-runner
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # dind network canary (argocd-projects#75): fetch through the dind
    # bridge the exact URL that black-holed when the bridge MTU (1500)
    # exceeded the flannel overlay (1450). Fails fast if the MTU
    # regression ever comes back, instead of a build step hanging 5min.
    #
    # It tests for a STALL, not for throughput. An MTU black hole moves ~0
    # bytes, so "< 100 KB/s for 20s" catches it as fast as before. It used to
    # be `--max-time 30` on a 60 MB file, which also failed any link slower
    # than ~2 MB/s: on 2026-10-27 the degraded Deco backhaul (homelab#1801) gave
    # 1.55 MB/s, and two builds died here with 46 of 60 MB received, i.e.
    # working, just slow. Checked with curl --limit-rate: 1.5 MB/s now passes
    # (40s), 10 KB/s still exits 28 at 20s. --max-time stays as a backstop.
    - name: dind network canary
      run: |
        docker run --rm curlimages/curl:latest \
          -sfSL -o /dev/null -w 'canary fetch: %{time_total}s\n' \
          --speed-limit 100000 --speed-time 20 --max-time 600 \
          https://dl.k8s.io/release/v1.34.6/bin/linux/amd64/kubectl

    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
      with:
        method: oidc
        identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
        env-slug: prod
        project-slug: homelab-bz-gt
        secret-path: /
        export-type: env
        domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

    - name: Log in to Harbor (internal)
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ${{ env.INTERNAL_REGISTRY }}
        username: ${{ env.HB_USERNAME }}
        password: ${{ env.HB_PASSWORD }}

    # Build and push via the docker CLI (daemon), NOT buildx/build-push-action.
    # The push goes through the dind daemon, which trusts the rotated Harbor CA
    # via the mounted certs.d bundle (same path that makes `docker login` work
    # above). build-push-action pushes with buildkit's own exporter, a separate
    # TLS trust domain that still sees the stale baked CA -> x509. See homelab#426.
    # Image tag = <actions/runner version>-<run_number>, e.g. 2.338.2-81
    # (arc-runner-docker#58). argocd-projects' Renovate reads it from the
    # release tag below and treats a run-number-only change as a patch: a
    # rebuild on the same runner automerges, a runner minor/major waits for
    # review. scripts/release-lib.sh fails the build rather than make a tag
    # outside that shape (Renovate goes quiet on one it cannot parse).
    - name: Build and push actions-runner
      run: |
        set -o pipefail
        . scripts/release-lib.sh
        img=${INTERNAL_REGISTRY}/${PROJECT}/actions-runner
        docker build -f Dockerfile -t $img:latest .
        # Gate BEFORE push (homelab#1812 AC2): every runner pulls :latest, and
        # a broken tool cache still reads as a hit (the .complete marker does
        # not check contents) -- jobs would fail later, confusingly. Exercise
        # each baked tool and its marker; any failure stops the push.
        docker run --rm --entrypoint bash $img:latest -euo pipefail -c '
          tc=$RUNNER_TOOL_CACHE
          for t in go Python node; do ls $tc/$t/*/x64.complete; done
          $tc/go/*/x64/bin/go version
          cd "$(mktemp -d)" && printf "package main\nimport (\"fmt\";\"net/http\")\nfunc main(){fmt.Println(http.StatusOK)}\n" > m.go
          GOFLAGS=-mod=mod $tc/go/*/x64/bin/go run m.go
          LD_LIBRARY_PATH=$(echo $tc/Python/*/x64/lib) $tc/Python/*/x64/bin/python3 -c "import ssl,sqlite3,venv,unittest; print(\"python ok\")"
          $tc/node/*/x64/bin/node -e "console.log(\"node\", process.version)"
          helm version --short && kubeconform -v && kubectl version --client && yq --version
          # Every baked binary resolves all its shared libraries. Explicit
          # exit: set -e ignores a failing `! cmd`, and ldd exits 1 on the
          # static ones (helm, kubectl...), which pipefail would pass through.
          for b in $tc/node/*/x64/bin/node $tc/go/*/x64/bin/go $tc/Python/*/x64/bin/python3 \
                   $(command -v helm kubeconform kubectl yq gh git); do
            if LD_LIBRARY_PATH=$(echo $tc/Python/*/x64/lib) ldd $b 2>&1 | grep "not found"; then
              echo "$b: unresolved shared library"; exit 1
            fi
          done
          # ...and so do toolchains setup-* DOWNLOADS on a cache miss, which the
          # loop above cannot see: node 26+ needs libatomic.so.1 and, without
          # it, setup-node fails with exit 127 (#40).
          for l in libatomic.so.1; do ldconfig -p | awk "{print \$1}" | grep -qx $l || { echo "missing $l"; exit 1; }; done
          test -w $tc && echo "tool cache writable by $(id -un)"'
        # Read the version from the image just built: the upstream image's
        # labels do not carry it (org.opencontainers.image.version is "24.04").
        ver=$(docker run --rm --entrypoint /home/runner/bin/Runner.Listener $img:latest --version 2>/dev/null | runner_version)
        TAG=$(image_tag "$ver" "${{ github.run_number }}")
        echo "actions/runner $ver -> image tag $TAG"
        echo "RUNNER_VERSION=$ver" >> "$GITHUB_ENV"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        docker tag $img:latest $img:$TAG
        docker push $img:latest
        docker push $img:$TAG

    # Dedicated OrcaSlicer build image. It derives from the general-purpose
    # image just built above, so both images share the same runner/toolchain
    # baseline and receive the same tag ($TAG) in this release cycle.
    - name: Build and push orcaslicer-runner
      run: |
        base=${INTERNAL_REGISTRY}/${PROJECT}/actions-runner:${TAG}
        img=${INTERNAL_REGISTRY}/${PROJECT}/orcaslicer-runner
        docker build --pull -f Dockerfile.orcaslicer --build-arg BASE_IMAGE=$base -t $img:latest -t $img:${TAG} .
        # Validate non-root runtime and the GTK3 probe used by build_linux.sh.
        docker run --rm --entrypoint bash $img:latest -euo pipefail -c '
          test "$(id -u)" -ne 0
          test "$(id -un)" = runner
          dpkg-query -W -f="\${Status}\\n" libgtk-3-dev | grep -qx "install ok installed"
          test -f /usr/include/gtk-3.0/gtk/gtk.h
          command -v cmake
          command -v ninja
          command -v nasm && command -v yasm && command -v pkgconf
          echo "OrcaSlicer runner prerequisites OK; runtime user: $(id -un)"
        '
        docker push $img:latest
        docker push $img:${TAG}

    - name: Build and push dind
      run: |
        img=${INTERNAL_REGISTRY}/${PROJECT}/dind
        docker build -f Dockerfile.dind -t $img:latest -t $img:${TAG} .
        docker push $img:latest
        docker push $img:${TAG}

    # The release says why it was built and what changed (#58 AC1, AC2):
    # scripts/release-lib.sh writes the trigger, the actions/runner version
    # before -> after and a dpkg diff against the previous release's image.
    # release.yml then APPENDS its AI commit summary below; it must not
    # replace these facts.
    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        REASON: ${{ inputs.reason }}
        ACTOR: ${{ github.actor }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        . scripts/release-lib.sh
        API="https://api.github.com/repos/${REPO}"
        AUTH="Authorization: Bearer $GITHUB_TOKEN"
        NEW_TAG=$(release_tag "$TAG")
        img=${INTERNAL_REGISTRY}/${PROJECT}/actions-runner
        SUBJECT=
        case "$EVENT" in
          push)              TRIGGER=push; SUBJECT=$(git log -1 --format=%s "$SHA") ;;
          schedule)          TRIGGER=schedule ;;
          workflow_dispatch) if [ -n "$REASON" ]; then TRIGGER=watcher; else TRIGGER=manual; fi ;;
          *) echo "::error::unexpected event $EVENT"; exit 1 ;;
        esac

        # Previous release = newest one that is not this build's own (a re-run
        # finds its own release already there). Its image may be gone from
        # Harbor; the body then says it could not compare, never "no changes".
        PREV_TAG=$(curl -sf -H "$AUTH" "${API}/releases?per_page=5" \
          | jq -r --arg t "$NEW_TAG" '[.[] | select(.tag_name != $t)][0].tag_name // empty')
        dpkg_list() { docker run --rm --entrypoint dpkg-query "$1" -W -f='${Package} ${Version}\n'; }
        OLD_RUNNER=
        : > old-pkgs.txt
        if [ -n "$PREV_TAG" ] && prev=$(prev_image_tag "$PREV_TAG") && docker pull -q "$img:$prev" >/dev/null; then
          OLD_RUNNER=$(docker run --rm --entrypoint /home/runner/bin/Runner.Listener "$img:$prev" --version 2>/dev/null | runner_version) || OLD_RUNNER=
          dpkg_list "$img:$prev" > old-pkgs.txt || : > old-pkgs.txt
        fi
        dpkg_list "$img:$TAG" > new-pkgs.txt

        TRIGGER=$TRIGGER SUBJECT=$SUBJECT PREV_TAG=$PREV_TAG OLD_RUNNER=$OLD_RUNNER \
          NEW_RUNNER=$RUNNER_VERSION OLD_PKGS=old-pkgs.txt NEW_PKGS=new-pkgs.txt \
          release_body > body.md
        cat body.md

        # Renovate in dvystrcil/argocd-projects bumps the pinned runner tags
        # from THESE releases (argocd-projects#339), so a missing release is a
        # build nobody deploys: fail loudly. The one tolerated case is a re-run,
        # which reuses run_number and finds its own release already there.
        code=$(curl -s -o release.json -w '%{http_code}' -X POST \
          -H "$AUTH" -H "Content-Type: application/json" "${API}/releases" \
          -d "$(jq -n --arg tag "$NEW_TAG" --arg name "actions-runner $TAG" --rawfile body body.md \
            '{tag_name: $tag, name: $name, body: $body}')")
        if [ "$code" = 201 ]; then echo "created release $NEW_TAG"; exit 0; fi
        if curl -sf -o /dev/null -H "$AUTH" "${API}/releases/tags/${NEW_TAG}"; then
          echo "release $NEW_TAG already exists (re-run)"; exit 0
        fi
        echo "::error::creating release $NEW_TAG failed: HTTP $code"; cat release.json; exit 1
