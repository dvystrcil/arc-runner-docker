name: Build and Push Runner Images

on:
  workflow_dispatch:

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: arc

jobs:
  build:
    runs-on: arc-runner-docker-runner
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # dind network canary (argocd-projects#75): fetch through the dind
    # bridge the exact URL that black-holed when the bridge MTU (1500)
    # exceeded the flannel overlay (1450). Fails fast if the MTU
    # regression ever comes back, instead of a build step hanging 5min.
    #
    # It tests for a STALL, not for throughput. An MTU black hole moves ~0
    # bytes, so "< 100 KB/s for 20s" catches it as fast as before. It used to
    # be `--max-time 30` on a 60 MB file, which also failed any link slower
    # than ~2 MB/s: on 2026-10-27 the degraded Deco backhaul (homelab#1801) gave
    # 1.55 MB/s, and two builds died here with 46 of 60 MB received, i.e.
    # working, just slow. Checked with curl --limit-rate: 1.5 MB/s now passes
    # (40s), 10 KB/s still exits 28 at 20s. --max-time stays as a backstop.
    - name: dind network canary
      run: |
        docker run --rm curlimages/curl:latest \
          -sfSL -o /dev/null -w 'canary fetch: %{time_total}s\n' \
          --speed-limit 100000 --speed-time 20 --max-time 600 \
          https://dl.k8s.io/release/v1.34.6/bin/linux/amd64/kubectl

    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.18
      with:
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        env-slug: prod
        project-slug: homelab-bz-gt
        secret-path: /
        export-type: env
        domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

    - name: Log in to Harbor (internal)
      uses: docker/login-action@v4
      with:
        registry: ${{ env.INTERNAL_REGISTRY }}
        username: ${{ env.HB_USERNAME }}
        password: ${{ env.HB_PASSWORD }}

    # Build and push via the docker CLI (daemon), NOT buildx/build-push-action.
    # The push goes through the dind daemon, which trusts the rotated Harbor CA
    # via the mounted certs.d bundle (same path that makes `docker login` work
    # above). build-push-action pushes with buildkit's own exporter, a separate
    # TLS trust domain that still sees the stale baked CA -> x509. See homelab#426.
    - name: Build and push actions-runner
      run: |
        img=${INTERNAL_REGISTRY}/${PROJECT}/actions-runner
        docker build -f Dockerfile -t $img:latest -t $img:${{ github.run_number }} .
        docker push $img:latest
        docker push $img:${{ github.run_number }}

    - name: Build and push dind
      run: |
        img=${INTERNAL_REGISTRY}/${PROJECT}/dind
        docker build -f Dockerfile.dind -t $img:latest -t $img:${{ github.run_number }} .
        docker push $img:latest
        docker push $img:${{ github.run_number }}

    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        DATE=$(date -u +%Y.%-m.%-d)
        NEW_TAG="v${DATE}.${GITHUB_RUN_NUMBER}"
        curl -sf -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Content-Type: application/json" \
          "https://api.github.com/repos/${REPO}/releases" \
          -d "$(jq -n --arg tag "$NEW_TAG" --arg name "Nightly $NEW_TAG" \
            '{tag_name: $tag, name: $name, generate_release_notes: true}')" || true
