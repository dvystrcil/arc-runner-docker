name: Mirror Base Images

on:
  schedule:
    - cron: '0 1 * * *'   # daily at 1am
  workflow_dispatch:

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local

jobs:
  mirror:
    runs-on: arc-runner-docker-runner
    permissions:
      contents: read
      actions: write

    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Log in to Harbor (internal)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - name: Check and mirror actions-runner
        id: mirror-runner
        run: |
          UPSTREAM_DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/actions/actions-runner:latest \
            --format '{{json .Manifest.Digest}}')
          echo "Upstream: ${UPSTREAM_DIGEST}"

          HARBOR_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.INTERNAL_REGISTRY }}/ghcr-proxy/actions/actions-runner:latest \
            --format '{{json .Manifest.Digest}}' 2>/dev/null || echo "none")
          echo "Harbor:   ${HARBOR_DIGEST}"

          if [ "$UPSTREAM_DIGEST" != "$HARBOR_DIGEST" ]; then
            echo "Digest changed — mirroring..."
            docker pull ghcr.io/actions/actions-runner:latest
            docker tag ghcr.io/actions/actions-runner:latest \
              ${{ env.INTERNAL_REGISTRY }}/ghcr-proxy/actions/actions-runner:latest
            docker push ${{ env.INTERNAL_REGISTRY }}/ghcr-proxy/actions/actions-runner:latest
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No change"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check and mirror dind
        id: mirror-dind
        run: |
          UPSTREAM_DIGEST=$(docker buildx imagetools inspect \
            docker:dind \
            --format '{{json .Manifest.Digest}}')
          echo "Upstream: ${UPSTREAM_DIGEST}"

          HARBOR_DIGEST=$(docker buildx imagetools inspect \
            ${{ env.INTERNAL_REGISTRY }}/dockerhub-proxy/library/docker:dind \
            --format '{{json .Manifest.Digest}}' 2>/dev/null || echo "none")
          echo "Harbor:   ${HARBOR_DIGEST}"

          if [ "$UPSTREAM_DIGEST" != "$HARBOR_DIGEST" ]; then
            echo "Digest changed — mirroring..."
            docker pull docker:dind
            docker tag docker:dind \
              ${{ env.INTERNAL_REGISTRY }}/dockerhub-proxy/library/docker:dind
            docker push ${{ env.INTERNAL_REGISTRY }}/dockerhub-proxy/library/docker:dind
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No change"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger build
        if: steps.mirror-runner.outputs.changed == 'true' || steps.mirror-dind.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yaml/dispatches" \
            -d '{"ref":"main"}'
