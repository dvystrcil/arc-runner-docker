name: Watch Upstream Base Images

on:
  schedule:
    - cron: '0 1 * * *'   # daily at 1am
  workflow_dispatch:

env:
  UPSTREAM_RUNNER: ghcr.io/actions/actions-runner:latest
  UPSTREAM_DIND: docker:dind

jobs:
  mirror:
    runs-on: arc-runner-docker-runner
    permissions:
      contents: read
      actions: write

    steps:
      # Digest state lives in the Actions cache, NOT in the proxy path. The
      # old version compared upstream against the copy at ghcr-proxy/... --
      # but READING a proxy-cache path triggers a pull-through, so that value
      # converges on upstream and the comparison can essentially never report
      # a change. See homelab#1180.
      - name: Restore last-seen digests
        uses: actions/cache@v6
        with:
          path: .upstream-digests
          key: upstream-digests-${{ github.run_id }}
          restore-keys: |
            upstream-digests-

      - name: Check whether upstream moved
        id: mirror
        run: |
          set -euo pipefail
          mkdir -p .upstream-digests
          changed=false

          # No mirroring. ghcr-proxy and dockerhub-proxy are Harbor PROXY
          # CACHES: they pull from upstream on demand and REJECT pushes --
          #   denied: can not push artifact to a proxy project: ghcr-proxy
          # so `docker pull && tag && push` could only ever fail. It looked
          # green for months because the push only ran on the days a digest
          # actually moved (homelab#1180, homelab#1184).
          for pair in "runner:${UPSTREAM_RUNNER}" "dind:${UPSTREAM_DIND}"; do
            name="${pair%%:*}"
            image="${pair#*:}"
            up=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')
            prev=$(cat ".upstream-digests/${name}" 2>/dev/null || echo "none")
            echo "${name}: upstream=${up} previous=${prev}"
            if [ "$up" != "$prev" ]; then
              echo "${name}: upstream moved"
              changed=true
            fi
            printf '%s' "$up" > ".upstream-digests/${name}"
          done

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Trigger build
        if: steps.mirror.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yaml/dispatches" \
            -d '{"ref":"main"}'
