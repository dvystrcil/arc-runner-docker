name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: arc-runner-docker-runner
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists PR commits via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full history for PR diff scans
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0  # pin the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
