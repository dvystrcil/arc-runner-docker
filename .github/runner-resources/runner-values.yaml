githubConfigUrl: "https://github.com/dvystrcil/arc-runner-docker"
runnerScaleSetName: "arc-runner-docker-runner"
minRunners: 0
maxRunners: 3

template:
  spec:
    nodeSelector:
      kubernetes.io/hostname: k8s-node-hpm-01
    imagePullSecrets:
    - name: arc-runner-harbor-pull
    initContainers:
    - name: init-docker-config
      image: harbor.sirddail.net/arc/actions-runner:latest
      command:
      - sh
      - -c
      - |
        mkdir -p /home/runner/.docker
        cp /harbor-creds/config.json /home/runner/.docker/config.json
        chmod 600 /home/runner/.docker/config.json
      volumeMounts:
      - name: harbor-creds
        mountPath: /harbor-creds
        readOnly: true
      - name: docker-config
        mountPath: /home/runner/.docker
    containers:
    - name: runner
      image: harbor.sirddail.net/arc/actions-runner:latest
      volumeMounts:
      - name: docker-config
        mountPath: /home/runner/.docker
    - name: dind
      image: harbor.sirddail.net/arc/dind:latest
    volumes:
    - name: docker-config
      emptyDir: {}
    - name: harbor-creds
      secret:
        secretName: arc-runner-harbor-pull
        items:
        - key: .dockerconfigjson
          path: config.json
